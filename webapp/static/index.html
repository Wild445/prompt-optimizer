<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NIQ Prompt Creator</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css?v=8" />
</head>
<body data-workspace="creator">
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-head">
        <h1>Prompt Creator</h1>
        <button type="button" class="panel-toggle" data-panel="sidebar" data-label="sidebar" aria-controls="sidebar-sections" aria-expanded="true">
          <span class="panel-toggle-icon" aria-hidden="true">&#171;</span>
        </button>
      </div>

      <div class="sections" id="sidebar-sections">
        <!-- The head is a switch, not a disclosure: clicking it opens that
             workspace's full view on the right, and only the open workspace
             shows a history. What collapses inside is the step picker alone -
             folding the workflow away gives the history list the room. -->
        <section class="workspace-section active" data-section="creator">
          <button type="button" class="section-head" aria-pressed="true">
            <span class="section-text">
              <span class="section-title">Prompt Creation</span>
              <span class="section-hint">build &amp; refine</span>
            </span>
            <span class="section-open">Open</span>
          </button>
          <div class="section-body">
            <button id="new-chat" class="btn-primary">+ New chat</button>
            <div class="stage-picker" data-picker="creator">
              <button type="button" class="stage-picker-head" aria-expanded="true">
                <span class="stage-picker-chev">&#9654;</span>
                <span class="stage-picker-label">Pipeline steps</span>
                <span class="stage-picker-hint">Pick where to start</span>
              </button>
              <div id="stage-list" class="stage-list"></div>
            </div>
            <div class="history-head">
              <span>Chat history</span>
              <span id="conversation-count" class="history-count"></span>
            </div>
            <nav id="conversation-list" class="conversation-list" aria-label="Conversations"></nav>
          </div>
        </section>

        <section class="workspace-section" data-section="optimizer">
          <button type="button" class="section-head" aria-pressed="false">
            <span class="section-text">
              <span class="section-title">Prompt Optimization</span>
              <span class="section-hint">judge &amp; iterate</span>
            </span>
            <span class="section-open">Open</span>
          </button>
          <div class="section-body">
            <button id="new-optimization" class="btn-primary">+ New optimization</button>
            <div class="stage-picker" data-picker="optimizer">
              <button type="button" class="stage-picker-head" aria-expanded="true">
                <span class="stage-picker-chev">&#9654;</span>
                <span class="stage-picker-label">Loop steps</span>
                <span class="stage-picker-hint">Runs in order</span>
              </button>
              <div id="optimizer-step-list" class="stage-list"></div>
            </div>
            <div class="history-head">
              <span>Optimization history</span>
              <span id="optimization-count" class="history-count"></span>
            </div>
            <nav id="optimization-list" class="conversation-list" aria-label="Optimizations"></nav>
          </div>
        </section>
      </div>

      <div class="sidebar-foot">
        <span id="db-hint">Everything is stored locally</span>
      </div>
    </aside>

    <!-- ------------------------------------------------ prompt creation -->

    <main class="main active" data-workspace="creator">
      <header class="topbar">
        <div class="topbar-title">
          <span id="conversation-title">New chat</span>
          <span id="conversation-id" class="conversation-id"></span>
        </div>
        <div class="topbar-actions">
          <span id="usage" class="usage"></span>
          <button id="toggle-settings" class="btn-ghost">Settings</button>
        </div>
      </header>

      <section id="settings" class="settings" hidden>
        <label>
          <span>Target model</span>
          <input id="target-model" type="text" placeholder="e.g. Azure OpenAI GPT-5.4" />
          <small>Leave empty to skip the model-tuning stage.</small>
        </label>
        <label>
          <span>Audience</span>
          <input id="audience" type="text" placeholder="a general-purpose LLM" />
        </label>
        <label class="wide">
          <span>Target-model notes</span>
          <textarea id="model-notes" rows="4" placeholder="Paste the target model's prompting guide. Without it, stage 5 stays deliberately generic instead of guessing at conventions."></textarea>
        </label>
        <label class="inline">
          <input id="humanize" type="checkbox" />
          <span>Run the humanizer on the final prompt</span>
        </label>
        <label class="inline">
          <span>Max clarification rounds</span>
          <input id="max-rounds" type="number" min="0" max="6" />
        </label>
      </section>

      <section id="transcript" class="transcript" aria-live="polite"></section>

      <footer class="composer">
        <textarea id="composer-input" rows="1" placeholder="Describe what you want a prompt for…"></textarea>
        <button id="send" class="btn-primary">Send</button>
      </footer>
    </main>

    <aside class="progress-panel active" data-workspace="creator" aria-label="Pipeline progress">
      <div class="progress-head">
        <button type="button" class="panel-toggle" data-panel="progress" data-label="progress panel" aria-expanded="true">
          <span class="panel-toggle-icon" aria-hidden="true">&#187;</span>
        </button>
        <span class="panel-label">Progress</span>
        <span id="progress-status" class="progress-status">Idle</span>
      </div>
      <ol id="progress-list" class="progress-list" aria-live="polite"></ol>
      <div class="progress-foot">
        <span id="progress-hint">Steps tick off as each one finishes.</span>
      </div>
    </aside>

    <!-- ------------------------------------------------ prompt optimization -->

    <main class="main" data-workspace="optimizer">
      <header class="topbar">
        <div class="topbar-title">
          <span id="optimization-title">New optimization</span>
          <span id="optimization-id" class="conversation-id"></span>
        </div>
        <div class="topbar-actions">
          <span id="optimization-usage" class="usage"></span>
        </div>
      </header>

      <section id="opt-transcript" class="transcript" aria-live="polite"></section>
    </main>

    <aside class="progress-panel" data-workspace="optimizer" aria-label="Optimization progress">
      <div class="progress-head">
        <button type="button" class="panel-toggle" data-panel="progress" data-label="progress panel" aria-expanded="true">
          <span class="panel-toggle-icon" aria-hidden="true">&#187;</span>
        </button>
        <span class="panel-label">Test cases</span>
        <span id="optimizer-progress-status" class="progress-status">Idle</span>
      </div>
      <div id="scoreboard" class="scoreboard" aria-live="polite"></div>
      <ol id="optimizer-progress-list" class="progress-list" aria-live="polite"></ol>
      <div class="progress-foot">
        <span>Results are written to <code>outputs/optimizations/</code>.</span>
      </div>
    </aside>
  </div>

  <script type="module" src="main.js?v=8"></script>
</body>
</html>
